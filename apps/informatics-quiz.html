<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f4">
    <meta name="description" content="Teste dein Wissen zu Bits, Binärzahlen und Algorithmen.">
    <title>Informatik-Quiz | Grundlagenfach Informatik</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./informatics-quiz.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 5.5h5v5H5zm9 0h5v5h-5zm-9 9h5v5H5zm9 0h5v5h-5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </span>
        Informatik entdecken
      </a>
      <span class="header-note">Interaktive Lern-Apps</span>
    </header>

    <main class="container">
      <section class="workspace" aria-labelledby="quiz-title">
        <a class="back-button" href="../index.html">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 10H5m5 5-5-5 5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Alle Lern-Apps
        </a>
        <p class="eyebrow">Wissen testen</p>
        <h1 id="quiz-title">Informatik-Quiz</h1>
        <p class="workspace-intro">Drei kurze Fragen. Wähle jeweils eine Antwort aus und schau, was du schon weißt.</p>

        <div class="demo-panel" id="quiz-panel">
          <div class="quiz-topline">
            <span id="quiz-counter">Frage 1 von 3</span>
            <span id="quiz-score">Punkte: 0</span>
          </div>
          <div class="quiz-progress" aria-hidden="true"><div class="quiz-progress-fill" id="quiz-progress"></div></div>
          <p class="quiz-question" id="quiz-question"></p>
          <div class="quiz-answers" id="quiz-answers"></div>
          <p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p>
          <div class="quiz-footer">
            <span class="quiz-score">Eine Frage nach der anderen – du schaffst das.</span>
            <button class="button" id="quiz-next" type="button" disabled>Weiter</button>
          </div>
        </div>
        <div class="quiz-finish" id="quiz-finish" hidden aria-live="polite">
          <h2 id="quiz-finish-title"></h2>
          <p id="quiz-finish-copy"></p>
          <button class="button" id="quiz-restart" type="button">Nochmal spielen</button>
        </div>
      </section>

      <footer class="site-footer">Grundlagenfach Informatik · Kleine Apps, grosse Ideen</footer>
    </main>
  </body>
</html>
