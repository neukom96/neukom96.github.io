<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <meta name="description" content="A small, calm daily planner that keeps your tasks in your browser.">
    <title>Daylight — your daily planner</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #26332d;
        --muted: #78827b;
        --line: #e8e9e3;
        --paper: #fff;
        --canvas: #f7f6f2;
        --green: #42745a;
        --green-dark: #315b45;
        --mint: #e7f0e9;
        --orange: #e8a767;
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 50% 0%, #f0eee6 0, transparent 48%),
          var(--canvas);
      }

      button, input { font: inherit; }
      button { color: inherit; }

      .app {
        width: min(100%, 660px);
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 48px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -.03em;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 10px;
        color: var(--green-dark);
        background: var(--mint);
      }

      .brand-mark svg { width: 17px; height: 17px; }

      .local-note {
        color: var(--muted);
        font-size: 12px;
      }

      .intro { margin-bottom: 25px; }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--green);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(36px, 8vw, 48px);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: 1.05;
      }

      .date {
        margin: 11px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .card {
        overflow: hidden;
        border: 1px solid rgba(38, 51, 45, .06);
        border-radius: 20px;
        background: var(--paper);
        box-shadow: 0 16px 48px rgba(38, 51, 45, .07);
      }

      .progress {
        padding: 23px 26px 21px;
        border-bottom: 1px solid var(--line);
      }

      .progress-copy {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 13px;
        font-size: 13px;
      }

      .progress-copy strong { font-weight: 650; }
      .progress-copy span { color: var(--muted); font-size: 12px; }

      .progress-track {
        height: 6px;
        overflow: hidden;
        border-radius: 99px;
        background: #edf0eb;
      }

      .progress-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: var(--green);
        transition: width 180ms ease;
      }

      .add-form {
        display: flex;
        gap: 10px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }

      .add-form input {
        width: 100%;
        min-width: 0;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        color: var(--ink);
        background: #fcfcfa;
        font-size: 14px;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .add-form input::placeholder { color: #a0a7a1; }
      .add-form input:focus {
        border-color: #9ab5a1;
        box-shadow: 0 0 0 3px rgba(66, 116, 90, .1);
      }

      .add-button {
        flex: 0 0 auto;
        padding: 0 17px;
        border: 0;
        border-radius: 10px;
        color: white;
        background: var(--green);
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        transition: background 150ms ease, transform 150ms ease;
      }

      .add-button:hover { background: var(--green-dark); }
      .add-button:active { transform: scale(.97); }

      .list-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 26px 9px;
      }

      .list-heading h2 {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .11em;
        text-transform: uppercase;
      }

      .clear-button {
        padding: 4px 0;
        border: 0;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        cursor: pointer;
      }

      .clear-button:hover { color: var(--green-dark); }

      .task-list {
        min-height: 100px;
        margin: 0;
        padding: 0 12px 12px;
        list-style: none;
      }

      .task {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 8px 13px;
        border-radius: 11px;
      }

      .task:hover { background: #fafbf8; }

      .task-check {
        display: grid;
        flex: 0 0 auto;
        width: 19px;
        height: 19px;
        padding: 0;
        place-items: center;
        border: 1.5px solid #cbd2cb;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
      }

      .task-check:hover { border-color: var(--green); }
      .task-check[aria-pressed="true"] {
        border-color: var(--green);
        color: white;
        background: var(--green);
      }

      .task-check svg { width: 11px; height: 11px; }

      .task-label {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 14px;
        line-height: 1.4;
      }

      .task.is-complete .task-label {
        color: #9aa39c;
        text-decoration: line-through;
      }

      .delete-button {
        display: grid;
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 8px;
        color: #9ba39d;
        background: transparent;
        cursor: pointer;
        opacity: 0;
      }

      .task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
      .delete-button:hover { color: #a44e3d; background: #f8eeeb; }
      .delete-button svg { width: 15px; height: 15px; }

      .empty-state {
        display: grid;
        min-height: 112px;
        padding: 20px;
        place-content: center;
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        margin-bottom: 5px;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: 400;
      }

      .empty-state span { font-size: 12px; }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 26px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .filters { display: flex; gap: 4px; }

      .filter-button {
        padding: 6px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        cursor: pointer;
      }

      .filter-button[aria-pressed="true"] {
        color: var(--green-dark);
        background: var(--mint);
        font-weight: 650;
      }

      .footer-note {
        margin: 18px 0 0;
        color: #9ba19b;
        font-size: 11px;
        text-align: center;
      }

      button:focus-visible {
        outline: 3px solid rgba(66, 116, 90, .3);
        outline-offset: 2px;
      }

      @media (max-width: 520px) {
        body { padding: 26px 14px; }
        .topbar { margin-bottom: 37px; }
        .local-note { font-size: 11px; }
        .progress { padding: 20px; }
        .add-form { padding: 17px 16px; }
        .list-heading { padding-right: 20px; padding-left: 20px; }
        .card-footer { padding: 12px 14px; }
        .delete-button { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3.5v2M12 18.5v2M3.5 12h2m13 0h2M6 6l1.4 1.4m9.2 9.2L18 18m0-12-1.4 1.4m-9.2 9.2L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </span>
          Daylight
        </div>
        <span class="local-note">A little space for today</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Your daily planner</p>
        <h1 id="page-title">Make today count.</h1>
        <p class="date" id="today-date"></p>
      </section>

      <section class="card" aria-label="Daily tasks">
        <div class="progress">
          <div class="progress-copy">
            <strong id="progress-label">Your progress</strong>
            <span id="progress-count" aria-live="polite"></span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <form class="add-form" id="task-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input id="task-input" name="task" type="text" placeholder="What would you like to get done?" maxlength="120" autocomplete="off" required>
          <button class="add-button" type="submit">Add task</button>
        </form>

        <div class="list-heading">
          <h2>Today's list</h2>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>
        <ul class="task-list" id="task-list" aria-live="polite"></ul>

        <footer class="card-footer">
          <span id="items-left"></span>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
          </div>
        </footer>
      </section>
      <p class="footer-note">Your list is saved in this browser, just for you.</p>
    </main>

    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
    </style>

    <script>
      const STORAGE_KEY = "daylight-tasks-v1";
      const starterTasks = [
        { id: 1, title: "Take a few minutes to plan the day", completed: true },
        { id: 2, title: "Make progress on the thing that matters most", completed: false },
        { id: 3, title: "Step outside and get some fresh air", completed: false }
      ];

      const taskForm = document.querySelector("#task-form");
      const taskInput = document.querySelector("#task-input");
      const taskList = document.querySelector("#task-list");
      const itemsLeft = document.querySelector("#items-left");
      const progressCount = document.querySelector("#progress-count");
      const progressFill = document.querySelector("#progress-fill");
      const progressBar = document.querySelector("#progress-bar");
      const clearCompletedButton = document.querySelector("#clear-completed");
      let tasks = loadTasks();
      let currentFilter = "all";

      function loadTasks() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === null) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(starterTasks));
          return starterTasks.map((task) => ({ ...task }));
        }

        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed) || !parsed.every((task) =>
          Number.isInteger(task.id) &&
          typeof task.title === "string" &&
          typeof task.completed === "boolean"
        )) {
          throw new Error("Saved tasks have an unexpected format.");
        }
        return parsed;
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function render() {
        const completedCount = tasks.filter((task) => task.completed).length;
        const activeCount = tasks.length - completedCount;
        const percentage = tasks.length === 0 ? 0 : Math.round((completedCount / tasks.length) * 100);
        const visibleTasks = tasks.filter((task) => {
          if (currentFilter === "active") return !task.completed;
          if (currentFilter === "completed") return task.completed;
          return true;
        });

        progressCount.textContent = `${completedCount} of ${tasks.length} done`;
        progressFill.style.width = `${percentage}%`;
        progressBar.setAttribute("aria-valuenow", String(percentage));
        itemsLeft.textContent = `${activeCount} ${activeCount === 1 ? "task" : "tasks"} left`;
        clearCompletedButton.disabled = completedCount === 0;
        clearCompletedButton.style.opacity = completedCount === 0 ? ".45" : "1";
        taskList.replaceChildren();

        if (visibleTasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          const title = document.createElement("strong");
          const description = document.createElement("span");
          if (tasks.length === 0) {
            title.textContent = "A fresh start.";
            description.textContent = "Add a task above to get your day moving.";
          } else {
            title.textContent = currentFilter === "active" ? "All caught up." : "Nothing here yet.";
            description.textContent = currentFilter === "active" ? "You've completed every task." : "Try another filter to see your tasks.";
          }
          empty.append(title, description);
          taskList.append(empty);
          return;
        }

        for (const task of visibleTasks) {
          const item = document.createElement("li");
          item.className = `task${task.completed ? " is-complete" : ""}`;

          const check = document.createElement("button");
          check.className = "task-check";
          check.type = "button";
          check.setAttribute("aria-pressed", String(task.completed));
          check.setAttribute("aria-label", `${task.completed ? "Mark incomplete" : "Complete"}: ${task.title}`);
          if (task.completed) {
            check.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8 3 3 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          }
          check.addEventListener("click", () => {
            task.completed = !task.completed;
            saveTasks();
            render();
          });

          const label = document.createElement("span");
          label.className = "task-label";
          label.textContent = task.title;

          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.setAttribute("aria-label", `Delete: ${task.title}`);
          remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 6h10m-8 0 .5 9h5L13 6m-4.5 0V4.5h3V6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          remove.addEventListener("click", () => {
            tasks = tasks.filter((entry) => entry.id !== task.id);
            saveTasks();
            render();
          });

          item.append(check, label, remove);
          taskList.append(item);
        }
      }

      taskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = taskInput.value.trim();
        if (!title) return;
        tasks.push({ id: Date.now(), title, completed: false });
        saveTasks();
        taskInput.value = "";
        currentFilter = "all";
        updateFilters();
        render();
        taskInput.focus();
      });

      function updateFilters() {
        document.querySelectorAll(".filter-button").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        });
      }

      document.querySelectorAll(".filter-button").forEach((button) => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          updateFilters();
          render();
        });
      });

      clearCompletedButton.addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        render();
      });

      document.querySelector("#today-date").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric"
      }).format(new Date());

      render();
    </script>
  </body>
</html>
